[package]
name = "jingle"
version = "0.6.39"
edition = "2024"
description = "SMT Modeling for Ghidra's PCODE"
repository = "https://github.com/toolCHAINZ/jingle"
readme = "README.md"
license = "MIT"
authors = ["toolCHAINZ"]
rust-version = "1.88"
categories = ["mathematics"]
keywords = ["ghidra", "sleigh", "pcode", "smt"]
exclude = [
    "examples/*",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "jingle"
required-features = ["bin"]

[dependencies]
jingle_sleigh = { path = "../jingle_sleigh", version = "0.6" }
z3 = { version = "0.23.0" }
z3-sys = { version = "0.14.2", optional = true }
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive", "rc"] }
tracing = "0.1.44"
clap = { version = "4.6.8", optional = true, features = ["derive"] }
confy = { version = "2.0.0", optional = true }
hex = { version = "0.4.3", optional = true }
anyhow = { version = "1.0.104", optional = true }
pyo3 = { version = "0.30.1", optional = true, default-features = false, features = ["macros"] }
petgraph = "0.8.3"
inventory = "0.3.25"
itertools = "0.15.0"
im = "15.1"

[features]
default = []
bin = ["dep:clap", "dep:confy", "dep:hex", "dep:anyhow"]
gimli = ["jingle_sleigh/gimli"]
pyo3 = ["dep:pyo3", "jingle_sleigh/pyo3", "dep:z3-sys"]

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[[example]]
name = "location"
