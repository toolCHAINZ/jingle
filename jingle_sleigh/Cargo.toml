[package]
name = "jingle_sleigh"
version = "0.6.0"
edition = "2024"
description = "An FFI layer for Ghidra's SLEIGH"
repository = "https://github.com/toolCHAINZ/jingle"
readme = "README.md"
license = "MIT"
authors = ["toolCHAINZ"]
rust-version = "1.88"
categories = ["api-bindings"]
keywords = ["ghidra", "sleigh", "pcode"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "SLEIGH_LICENSE",
    "build.rs",
    "src/**/*.*"
]

[dependencies.pyo3]
version = "0.30.1"
optional = true
default-features = false
features = ["macros"]

[dependencies]
cxx = "1.0.205"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde-xml-rs = "0.8.2"
thiserror = { version = "2.0.21", features = [] }
object = { version = "0.41.0", optional = true }
tracing = "0.1.44"
pest = "2.9.6"
pest_derive = "2.9.6"

[build-dependencies]
cxx-build = "1.0.205"

[features]
gimli = ["dep:object"]
default = ["gimli"]
pyo3 = ["dep:pyo3"]
